# ════════════════════════════════════════════════════════════════════
# Guest One — nixpacks.toml pour Coolify
# ════════════════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ['nodejs_20', 'openssl']
aptPkgs = ['sqlite3', 'ca-certificates']

[phases.install]
cmds = [
  'npm install --legacy-peer-deps --no-audit --no-fund'
]

[phases.build]
cmds = [
  'npx prisma generate',
  'npm run build',
  'cp -r .next/static .next/standalone/.next/ || true',
  'cp -r public .next/standalone/public || true',
  'cp -r prisma .next/standalone/prisma || true',
  'cp -r scripts .next/standalone/scripts || true',
  'cp -r node_modules .next/standalone/node_modules || true',
  'cp package.json .next/standalone/package.json || true'
]
dependsOn = ['install']

[start]
cmd = 'mkdir -p /app/data && npx prisma db push --skip-generate --accept-data-loss 2>&1; node scripts/seed-services.cjs 2>&1 || true; node scripts/seed-airbnb-services.cjs 2>&1 || true; node scripts/seed-modeles-appareils.cjs 2>&1 || true; node scripts/seed-modules.cjs 2>&1 || true; node scripts/seed-plans.cjs 2>&1 || true; node scripts/create-admin.cjs 2>&1 || true; node scripts/seed-demo.cjs 2>&1 || true; exec node .next/standalone/server.js'

[variables]
NODE_ENV = 'production'
NEXT_TELEMETRY_DISABLED = '1'
PORT = '3000'
HOSTNAME = '0.0.0.0'
DATABASE_URL = 'file:/app/data/qrtags.db'
