# ════════════════════════════════════════════════════════════════════
# Guest One — docker-compose.yml
# Pour déploiement Docker manuel (Coolify utilise directement le Dockerfile).
# Usage : docker compose up -d --build
# ════════════════════════════════════════════════════════════════════

services:
  guestone:
    build:
      context: .
      dockerfile: Dockerfile
    image: guestone:latest
    container_name: guestone
    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"

    environment:
      # ─── Core ───
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/qrtags.db

      # ─── URLs publiques (à adapter à votre domaine) ───
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # ─── Secrets (OBLIGATOIRES — voir .env.example) ───
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CRON_SECRET: ${CRON_SECRET:-change-me}
      CRON_BACKUP_ENABLED: ${CRON_BACKUP_ENABLED:-false}
      CRON_BACKUP_SECRET: ${CRON_BACKUP_SECRET:-change-me}

      # ─── Demo reset (désactivé par défaut en prod, mettre 1 pour activer) ───
      ENABLE_DEMO_RESET: ${ENABLE_DEMO_RESET:-}

      # ─── Superadmin (créé au 1er démarrage) ───
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@qrtags.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}

      # ─── Services externes (optionnels — fallback automatique si vides) ───
      WAKIT_API_KEY: ${WAKIT_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_AI_ENABLED: ${GROQ_AI_ENABLED:-true}

    volumes:
      # Base SQLite + backups (PERSISTANT)
      - guestone_data:/app/data
      # Uploads utilisateurs (photos, etc.)
      - guestone_uploads:/app/public/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging limité pour éviter la saturation du disque
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  guestone_data:
    driver: local
  guestone_uploads:
    driver: local
